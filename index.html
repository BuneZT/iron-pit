<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRON PIT — 90s Gothic Arena Survival FPS</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111215;
        font-family: 'Courier New', Consolas, 'Lucida Console', Monaco, monospace;
        color: #e5e7eb;
        text-shadow: 1px 1px 1px rgba(0, 0, 0, 0.9);
      }

      #gameCanvas {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }

      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }

      /* Heavy Blood Damage Vignette */
      #damageVignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 140px rgba(185, 28, 28, 0.92);
        opacity: 0;
        transition: opacity 0.1s ease-out;
      }

      /* Top Status Bar (90s Chiseled Iron Frame) */
      .top-bar {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 16px;
        align-items: center;
        background: linear-gradient(180deg, #242220 0%, #151413 100%);
        border: 2px solid #4a4440;
        outline: 2px solid #0d0c0b;
        box-shadow: inset 1px 1px 0 #6e655f, inset -1px -1px 0 #100f0e, 0 8px 24px rgba(0, 0, 0, 0.85);
        border-bottom: 4px solid #b45309;
        padding: 8px 26px;
      }

      .stat-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-width: 100px;
      }

      .stat-label {
        font-size: 11px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #a39e99;
        font-weight: 700;
      }

      .stat-value {
        font-size: 24px;
        font-weight: 900;
        color: #f3f4f6;
        letter-spacing: 1px;
      }

      .stat-value.accent {
        color: #f59e0b;
      }

      /* Classic Quake / 90s FPS Chunky Crosshair */
      #crosshair {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 28px;
        height: 28px;
        transform: translate(-50%, -50%);
        transition: transform 0.05s ease-out;
      }

      #crosshair.expanded {
        transform: translate(-50%, -50%) scale(1.4);
      }

      .ch-line {
        position: absolute;
        background: #f3f4f6;
        box-shadow: 0 0 3px #000, 0 0 1px #000;
      }

      #crosshair.hit .ch-line {
        background: #dc2626;
      }

      #crosshair.hit .ch-dot {
        background: #dc2626;
      }

      .ch-top {
        width: 2px;
        height: 8px;
        left: 13px;
        top: 0;
      }
      .ch-bottom {
        width: 2px;
        height: 8px;
        left: 13px;
        bottom: 0;
      }
      .ch-left {
        width: 8px;
        height: 2px;
        left: 0;
        top: 13px;
      }
      .ch-right {
        width: 8px;
        height: 2px;
        right: 0;
        top: 13px;
      }
      .ch-dot {
        position: absolute;
        width: 4px;
        height: 4px;
        left: 12px;
        top: 12px;
        background: #f59e0b;
        box-shadow: 0 0 2px #000;
      }

      /* Bottom Left Health Panel (Beveled Iron Bar) */
      .health-panel {
        position: absolute;
        bottom: 24px;
        left: 24px;
        width: 270px;
        background: linear-gradient(180deg, #242220 0%, #151413 100%);
        border: 2px solid #4a4440;
        outline: 2px solid #0d0c0b;
        border-left: 5px solid #dc2626;
        box-shadow: inset 1px 1px 0 #6e655f, inset -1px -1px 0 #100f0e, 0 8px 24px rgba(0, 0, 0, 0.85);
        padding: 10px 16px;
      }

      .health-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
      }

      .health-title {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #d1cbbe;
      }

      .health-numbers {
        font-size: 22px;
        font-weight: 900;
        color: #ef4444;
        letter-spacing: 1px;
      }

      .health-bar-bg {
        width: 100%;
        height: 12px;
        background: #0f0e0d;
        border: 1px solid #383431;
        overflow: hidden;
      }

      #healthBarFill {
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          90deg,
          #dc2626 0px,
          #b91c1c 8px,
          #7f1d1d 8px,
          #7f1d1d 10px
        );
        transition: width 0.12s ease-out;
      }

      /* Bottom Right Ammo Panel (Chiseled Brass/Iron) */
      .ammo-panel {
        position: absolute;
        bottom: 24px;
        right: 24px;
        min-width: 240px;
        background: linear-gradient(180deg, #242220 0%, #151413 100%);
        border: 2px solid #4a4440;
        outline: 2px solid #0d0c0b;
        border-right: 5px solid #d97706;
        box-shadow: inset 1px 1px 0 #6e655f, inset -1px -1px 0 #100f0e, 0 8px 24px rgba(0, 0, 0, 0.85);
        padding: 10px 18px;
        text-align: right;
      }

      .weapon-name {
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #a8a29e;
        margin-bottom: 3px;
      }

      .ammo-count {
        font-size: 32px;
        font-weight: 900;
        color: #fbbf24;
        letter-spacing: 1px;
      }

      .ammo-reserve {
        font-size: 18px;
        color: #78716c;
      }

      #reloadHint {
        margin-top: 3px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: #f59e0b;
        min-height: 16px;
      }

      /* Modal Overlay (90s Gothic Stone / Iron Monolith) */
      #modalOverlay {
        position: fixed;
        inset: 0;
        background: rgba(10, 11, 14, 0.88);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 25;
      }

      #modalOverlay.hidden {
        display: none;
      }

      .modal-card {
        background: linear-gradient(180deg, #242220 0%, #141312 100%);
        border: 3px solid #574f49;
        outline: 2px solid #0b0a09;
        border-top: 5px solid #d97706;
        padding: 36px 44px;
        max-width: 500px;
        width: 90%;
        text-align: center;
        box-shadow: inset 1px 1px 0 #786f68, inset -2px -2px 0 #0f0e0d, 0 24px 60px rgba(0, 0, 0, 0.95);
      }

      .modal-title {
        font-size: 40px;
        font-weight: 900;
        letter-spacing: 5px;
        color: #f3f4f6;
        margin-bottom: 8px;
        text-shadow: 2px 2px 0 #000;
      }

      .modal-subtitle {
        font-size: 13px;
        color: #a8a29e;
        margin-bottom: 24px;
        line-height: 1.6;
        letter-spacing: 0.5px;
      }

      .controls-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        text-align: left;
        background: #0f0e0d;
        border: 1px solid #383431;
        padding: 14px 18px;
        margin-bottom: 26px;
        font-size: 12px;
      }

      .key-badge {
        display: inline-block;
        background: #2b2724;
        border: 1px solid #574f49;
        color: #fbbf24;
        font-weight: 900;
        padding: 2px 7px;
        margin-right: 8px;
        font-size: 11px;
      }

      #actionButton {
        pointer-events: auto;
        cursor: pointer;
        background: linear-gradient(180deg, #d97706 0%, #92400e 100%);
        color: #fef3c7;
        border: 2px solid #f59e0b;
        outline: 2px solid #451a03;
        font-family: inherit;
        font-size: 16px;
        font-weight: 900;
        letter-spacing: 3px;
        text-transform: uppercase;
        padding: 14px 32px;
        width: 100%;
        box-shadow: inset 1px 1px 0 #fde68a, inset -2px -2px 0 #78350f, 0 6px 16px rgba(0, 0, 0, 0.85);
        transition: filter 0.1s ease, transform 0.08s ease;
      }

      #actionButton:hover {
        filter: brightness(1.15);
        transform: translateY(-1px);
      }

      #actionButton:active {
        transform: translateY(1px);
        box-shadow: inset 2px 2px 0 #78350f, inset -1px -1px 0 #fde68a;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div id="damageVignette"></div>

      <div class="top-bar">
        <div class="stat-block">
          <span class="stat-label">Wave</span>
          <span id="waveValue" class="stat-value accent">1</span>
        </div>
        <div class="stat-block">
          <span class="stat-label" id="enemiesLabel">Hostiles</span>
          <span id="enemiesValue" class="stat-value">5</span>
        </div>
        <div class="stat-block">
          <span class="stat-label">Kills</span>
          <span id="killsValue" class="stat-value">0</span>
        </div>
      </div>

      <div id="crosshair">
        <div class="ch-line ch-top"></div>
        <div class="ch-line ch-bottom"></div>
        <div class="ch-line ch-left"></div>
        <div class="ch-line ch-right"></div>
        <div class="ch-dot"></div>
      </div>

      <div class="health-panel">
        <div class="health-header">
          <span class="health-title">ARMOR INTEGRITY</span>
          <span id="healthText" class="health-numbers">100 / 100</span>
        </div>
        <div class="health-bar-bg">
          <div id="healthBarFill"></div>
        </div>
      </div>

      <div class="ammo-panel">
        <div class="weapon-name">HEAVY IRON CARBINE</div>
        <div>
          <span id="ammoValue" class="ammo-count">12</span>
          <span class="ammo-reserve">/ ∞</span>
        </div>
        <div id="reloadHint">READY</div>
      </div>
    </div>

    <div id="modalOverlay">
      <div class="modal-card">
        <h1 id="modalTitle" class="modal-title">IRON PIT</h1>
        <p id="modalSubtitle" class="modal-subtitle">
          Survive escalating waves of demonic chasers in the foggy ruins.
          Heavy kinetic rounds stagger and physically knock down targets.
        </p>

        <div class="controls-grid">
          <div><span class="key-badge">WASD</span>Move</div>
          <div><span class="key-badge">MOUSE</span>Aim</div>
          <div><span class="key-badge">LMB</span>Fire Weapon</div>
          <div><span class="key-badge">R</span>Reload</div>
          <div><span class="key-badge">SHIFT</span>Sprint</div>
          <div><span class="key-badge">SPACE</span>Jump</div>
        </div>

        <button id="actionButton" type="button">ENTER THE PIT</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
